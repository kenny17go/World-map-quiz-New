<style>
:root{--navy:#0b1930;--navy2:#123b62;--ocean:#cfe8f4;--land:#efd09a;--land2:#f8dea8;--border:#7e6849;--accent:#2d79ca;--correct:#19875b;--wrong:#cf4f4a;--text:#17233b;--muted:#6d788c;--line:#dce6ee;--shadow:0 14px 36px rgba(8,35,65,.17)}
*{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#eaf2f7;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{z-index:20;padding:10px 14px;background:linear-gradient(120deg,var(--navy),var(--navy2));color:white;display:flex;gap:12px;align-items:center;box-shadow:0 2px 16px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:9px;min-width:max-content} .logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:21px} .brand b{font-size:1.02rem} .brand small{display:block;color:#bdd0e3;font-size:.68rem;margin-top:2px;letter-spacing:.05em}
.toolbar{display:flex;align-items:center;gap:7px;flex:1;flex-wrap:wrap} select,button{font:inherit;border-radius:10px;min-height:36px;border:1px solid rgba(255,255,255,.15)} select{background:white;color:var(--text);padding:0 28px 0 10px} button{background:rgba(255,255,255,.1);color:#fff;padding:0 12px;cursor:pointer} button.primary{background:#fff;color:var(--navy);font-weight:800} button.answer{color:#ffe5a8;border-color:rgba(255,226,164,.35)} button:disabled{opacity:.4}
.score{margin-left:auto;display:flex;gap:9px;white-space:nowrap;background:rgba(255,255,255,.1);padding:7px 10px;border-radius:11px;font-size:.8rem} .score strong{font-size:.96rem}
.map-wrap{position:relative;min-height:0;overflow:hidden;background:linear-gradient(#d9eef7,#c6e4f1)}
#world{width:100%;height:100%;display:block;touch-action:none;user-select:none;background:radial-gradient(circle at 24% 18%,rgba(255,255,255,.45),transparent 25%)}
.graticule line{stroke:#5d96b1;stroke-width:.6;opacity:.22;vector-effect:non-scaling-stroke}
.country{fill:var(--land);stroke:var(--border);stroke-width:.75;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .12s ease,opacity .12s ease,stroke-width .12s ease} .country:hover{fill:#ffd879;stroke-width:1.4} .country.hidden{display:none} .country.wrong{fill:#e98b85;stroke:#9f3733;stroke-width:2.1} .country.correct{fill:#4fbd89;stroke:#176f4d;stroke-width:2.2} .country.study{fill:var(--land2)} .country.study-selected{fill:#ffd35c;stroke:#173f5f;stroke-width:3.2;filter:drop-shadow(0 0 2px rgba(23,63,95,.45))}
.hint{position:absolute;top:13px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);padding:8px 13px;border-radius:999px;box-shadow:var(--shadow);font-size:.77rem;color:#506079;white-space:nowrap;pointer-events:none}
.zoom{position:absolute;right:12px;top:12px;display:grid;gap:6px} .zoom button{width:38px;height:38px;padding:0;background:#fff;color:var(--navy);border:0;box-shadow:var(--shadow);font-size:1.2rem;font-weight:700}
.badge{position:absolute;right:12px;bottom:12px;background:rgba(11,25,48,.88);color:#e5eef7;padding:7px 10px;border-radius:10px;font-size:.73rem;pointer-events:none}
.pop{position:absolute;z-index:15;display:none;min-width:130px;max-width:220px;background:rgba(11,25,48,.96);color:#fff;border-radius:11px;padding:9px 11px;box-shadow:0 12px 32px rgba(0,0,0,.24);pointer-events:none;transform:translate(-50%,-115%)} .pop b{font-size:.92rem} .pop span{display:block;color:#c7d5e3;font-size:.72rem;line-height:1.45;margin-top:3px}
.bottom{background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;box-shadow:0 -8px 28px rgba(16,40,71,.08)}
.prompt{display:flex;gap:11px;align-items:center;min-width:0} .icon{width:42px;height:42px;flex:0 0 auto;border-radius:13px;background:#e9f2fc;color:var(--accent);display:grid;place-items:center;font-size:20px} #question{font-weight:800;font-size:1.05rem;min-width:0} #question strong{color:var(--accent);font-size:1.14rem} #question small{display:block;color:var(--muted);font-size:.76rem;font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #feedback{font-weight:800;text-align:right;min-width:190px} #feedback.ok{color:var(--correct)} #feedback.no{color:var(--wrong)} #feedback.info{color:var(--accent)}
@media(max-width:820px){header{padding:9px 10px;gap:8px}.brand small{display:none}.brand b{font-size:.9rem}.logo{width:34px;height:34px}.score{order:3;width:100%;margin:0;justify-content:center;padding:5px}.toolbar{justify-content:flex-end}.bottom{grid-template-columns:1fr;gap:5px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}#feedback{text-align:left;padding-left:53px;min-width:0}}
@media(max-width:520px){.brand b{display:none} .toolbar{gap:4px} select,button{min-height:34px;padding-left:9px;padding-right:9px} .hint{display:none} .badge{display:none} #question{font-size:.96rem} #question strong{font-size:1.05rem}}

/* iPhone / Home Screen App optimizations */
html{height:100%;height:100dvh;background:var(--navy)}
body{height:100%;height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
.app{height:100%;height:100dvh;background:#eaf2f7}
header{padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
select,button{min-height:44px;font-size:16px;touch-action:manipulation}
button{font-weight:700}.toolbar button{min-width:82px}
.zoom{right:max(12px,env(safe-area-inset-right));top:12px}.zoom button{width:48px;height:48px;border-radius:14px;font-size:1.45rem}
.badge{right:max(12px,env(safe-area-inset-right));bottom:12px}
.bottom{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom))}
#world{-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.country{touch-action:none}
.install-tip{display:none;position:absolute;z-index:30;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(520px,calc(100% - 28px));background:rgba(11,25,48,.94);color:#fff;border-radius:14px;padding:10px 14px;font-size:.78rem;box-shadow:var(--shadow);pointer-events:none;text-align:center}
.rotate-tip{display:none;position:fixed;inset:0;z-index:999;background:linear-gradient(145deg,#08172b,#123b62);color:white;align-items:center;justify-content:center;text-align:center;padding:28px}.rotate-tip .card{max-width:340px}.rotate-tip .phone{font-size:3.5rem;display:block;transform:rotate(90deg);margin-bottom:20px}.rotate-tip b{font-size:1.25rem}.rotate-tip p{color:#c8d9e8;line-height:1.6;margin:10px 0 0}
@media (display-mode:standalone){.brand small{display:none}.install-tip{display:none!important}}
@media (orientation:portrait) and (max-width:900px){.rotate-tip{display:flex}}
@media (orientation:landscape) and (max-height:500px){
  .app{grid-template-rows:auto 1fr auto}
  header{padding-top:6px;padding-bottom:6px;gap:8px}
  .brand .logo{width:34px;height:34px}.brand b{font-size:.88rem}.brand small{display:none}
  .toolbar{flex-wrap:nowrap;gap:5px}.toolbar select,.toolbar button{min-height:40px;height:40px;font-size:14px;padding-left:9px;padding-right:9px}.toolbar button{min-width:70px}
  .score{font-size:.72rem;padding:5px 8px;gap:7px}.score strong{font-size:.86rem}
  .bottom{padding-top:7px;padding-bottom:max(7px,env(safe-area-inset-bottom));gap:8px}.icon{width:38px;height:38px;border-radius:11px}#question{font-size:.92rem}#question strong{font-size:1.02rem}#question small{font-size:.68rem}#feedback{font-size:.86rem;min-width:150px}
  .zoom button{width:44px;height:44px}.hint{top:8px;padding:6px 10px;font-size:.69rem}
}
@media (orientation:landscape) and (max-width:900px){.score{width:auto;order:initial;margin-left:auto}.bottom{grid-template-columns:minmax(0,1fr) auto}#feedback{text-align:right;padding-left:0}}


/* ===== V2.0 UI Refresh ===== */
:root{--v2-glass:rgba(255,255,255,.88);--v2-blue:#1769c2;--v2-deep:#071a33;--v2-gold:#ffcb4c}
header{background:linear-gradient(135deg,#071a33 0%,#0d3159 56%,#15558a 100%);padding:8px 12px;gap:10px}
.brand{gap:8px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#1f78d1,#35a8e8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 5px 14px rgba(0,0,0,.18)}
.brand small{display:none}.toolbar{flex-wrap:nowrap}.toolbar select{border:0;box-shadow:inset 0 0 0 1px rgba(15,46,77,.08)}
.toolbar button{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.08)}
.toolbar button:hover{background:rgba(255,255,255,.16)}
.toolbar .primary{background:#fff;color:#0b2b4c;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.toolbar .answer{background:rgba(255,203,76,.13);color:#ffe29a;border-color:rgba(255,203,76,.28)}
#resetScore{min-width:44px;font-size:0;padding:0 11px}#resetScore:after{content:"↻";font-size:21px}
.score{border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.map-wrap{background:linear-gradient(180deg,#dff3fb 0%,#cbeaf6 100%)}
#world{background:radial-gradient(circle at 38% 22%,rgba(255,255,255,.68),transparent 34%),linear-gradient(180deg,#dff3fb,#c9e8f5)}
.graticule line{stroke:#3b84a7;opacity:.13}
.country{fill:#f1d49c;stroke:#8a7552;stroke-width:.68}
.country:hover{fill:#ffda79;filter:drop-shadow(0 2px 2px rgba(32,55,70,.18))}
.hint{top:12px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(31,70,100,.13)}
.zoom button{border:1px solid rgba(21,73,110,.08);box-shadow:0 7px 20px rgba(25,65,95,.16)}
.bottom{position:relative;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(126,157,180,.24);box-shadow:0 -10px 30px rgba(16,50,75,.09);padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.prompt{justify-content:center}.icon{background:linear-gradient(145deg,#e8f3ff,#d9ebff);box-shadow:inset 0 0 0 1px rgba(23,105,194,.07)}
#question{font-size:1.02rem}#question strong{color:#1769c2;font-size:1.17rem}
#feedback{border-radius:10px;padding:7px 10px;transition:transform .18s ease,background .18s ease}
#feedback.ok{background:#eaf8f1}#feedback.no{background:#fff0ef}#feedback.info{background:#eef6ff}
.country.correct{animation:v2correct .42s ease}.country.wrong{animation:v2wrong .34s ease}
@keyframes v2correct{0%{filter:brightness(1)}45%{filter:brightness(1.18) drop-shadow(0 0 8px rgba(25,135,91,.35))}100%{filter:none}}
@keyframes v2wrong{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}70%{transform:translateX(2px)}}
@media (orientation:landscape) and (max-height:500px){
 header{padding-top:max(5px,env(safe-area-inset-top));padding-bottom:5px}
 .brand .logo{width:32px;height:32px}.toolbar select,.toolbar button{min-height:36px;height:36px}
 .score{padding:4px 7px}.bottom{padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .icon{width:34px;height:34px}.zoom button{width:42px;height:42px}
}


/* ===== V2.0 Phase 2 ===== */
@media (orientation:landscape) and (max-height:500px){
 .hint{background:rgba(255,255,255,.9);color:#435a70}
 .bottom{min-height:50px}
 #question small{opacity:.82}
 #feedback:empty{display:none}
}
@media (prefers-reduced-motion:reduce){.country,.country.correct,.country.wrong,#feedback{animation:none!important;transition:none!important}}

</style>

const svg=document.getElementById('world'), pop=document.getElementById('pop'), wrap=document.getElementById('mapWrap');
let vb={x:0,y:0,w:1800,h:900}, drag=null, pinch=null;
function applyView(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function setView(arr){vb={x:arr[0],y:arr[1],w:arr[2],h:arr[3]};applyView()}
function clampView(){vb.w=Math.max(180,Math.min(1800,vb.w));vb.h=vb.w/2;vb.x=Math.max(-80,Math.min(1880-vb.w,vb.x));vb.y=Math.max(-40,Math.min(940-vb.h,vb.y))}
function zoom(f,cx=vb.x+vb.w/2,cy=vb.y+vb.h/2){const nw=vb.w*f,nh=vb.h*f;const rx=(cx-vb.x)/vb.w,ry=(cy-vb.y)/vb.h;vb.x=cx-rx*nw;vb.y=cy-ry*nh;vb.w=nw;vb.h=nh;clampView();applyView()}
function clientToSvg(x,y){const r=svg.getBoundingClientRect();return {x:vb.x+(x-r.left)/r.width*vb.w,y:vb.y+(y-r.top)/r.height*vb.h}}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=clientToSvg(e.clientX,e.clientY);zoom(e.deltaY>0?1.15:.87,p.x,p.y)},{passive:false});
const activePointers=new Map(); let gestureMoved=false, lastTap=0;
function beginPinch(){const pts=[...activePointers.values()];if(pts.length<2)return;const a=pts[0],b=pts[1],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb},centerClient:{x:cx,y:cy},centerSvg:clientToSvg(cx,cy)};drag=null;gestureMoved=true}
svg.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();svg.setPointerCapture?.(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===1){drag={id:e.pointerId,x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,moved:false};gestureMoved=false}else beginPinch()},{passive:false});
svg.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;e.preventDefault();activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size>=2){if(!pinch)beginPinch();const pts=[...activePointers.values()],a=pts[0],b=pts[1];const d=Math.max(10,Math.hypot(a.x-b.x,a.y-b.y));const factor=pinch.dist/d;vb={...pinch.vb};const targetW=vb.w*factor,targetH=targetW/2;const rx=(pinch.centerSvg.x-vb.x)/vb.w,ry=(pinch.centerSvg.y-vb.y)/vb.h;vb.x=pinch.centerSvg.x-rx*targetW;vb.y=pinch.centerSvg.y-ry*targetH;vb.w=targetW;vb.h=targetH;clampView();applyView();gestureMoved=true;return}if(!drag||e.pointerId!==drag.id)return;const r=svg.getBoundingClientRect();const dx=(e.clientX-drag.x)/r.width*vb.w,dy=(e.clientY-drag.y)/r.height*vb.h;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>7){drag.moved=true;gestureMoved=true}vb.x=drag.vx-dx;vb.y=drag.vy-dy;clampView();applyView()},{passive:false});
function endPointer(e){activePointers.delete(e.pointerId);if(activePointers.size<2)pinch=null;if(activePointers.size===1){const [id,p]=activePointers.entries().next().value;drag={id,x:p.x,y:p.y,vx:vb.x,vy:vb.y,moved:true}}else if(activePointers.size===0){setTimeout(()=>drag=null,0)}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
svg.addEventListener('dblclick',e=>{e.preventDefault();const p=clientToSvg(e.clientX,e.clientY);zoom(.68,p.x,p.y)});

document.getElementById('zoomIn').onclick=()=>zoom(.75);document.getElementById('zoomOut').onclick=()=>zoom(1.33);document.getElementById('home').onclick=()=>setView(views[continent]||views.all);
function pool(){return COUNTRY_DATA.filter(c=>continent==='all'||c.continent===continent)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function refreshClasses(){paths.forEach(p=>{const c=DATA.get(p.dataset.iso);p.classList.toggle('hidden',continent!=='all'&&c?.continent!==continent);p.classList.toggle('study',mode==='study');p.classList.toggle('wrong',p.dataset.iso===wrongIso);p.classList.toggle('correct',p.dataset.iso===correctIso);p.classList.toggle('study-selected',mode==='study'&&p.dataset.iso===studyIso)})}
function nextQuestion(){completed=false;wrongIso=null;correctIso=null;pop.style.display='none';clearTimeout(wrongTimer);let p=pool();if(current&&p.length>1)p=p.filter(c=>c.iso2!==current.iso2);current=p[Math.floor(Math.random()*p.length)]||null;document.getElementById('feedback').textContent='';document.getElementById('feedback').className='';if(!current){document.getElementById('question').textContent='此範圍沒有可用國家資料';return}const n=current.names;document.getElementById('question').innerHTML=`請在地圖找出：<strong>${escapeHtml(n.zh)}</strong><small>${escapeHtml(n.en)}　/　${escapeHtml(n.ja)}</small>`;refreshClasses()}
function updateScore(){document.getElementById('correct').textContent=correct;document.getElementById('total').textContent=total;document.getElementById('rate').textContent=total?Math.round(correct/total*100)+'%':'–';try{localStorage.setItem('worldQuizScore',JSON.stringify({correct,total}))}catch(e){}}
function feedback(t,cls=''){const el=document.getElementById('feedback');el.textContent=t;el.className=cls}
function guess(iso){if(mode!=='quiz'||!current||completed)return;if(drag?.moved)return;if(iso===current.iso2){completed=true;correct++;total++;wrongIso=null;correctIso=iso;feedback('✓ 答對了！','ok');updateScore();refreshClasses()}else{wrongIso=iso;correctIso=null;feedback('再想想看，答案沒有被揭露','no');refreshClasses();clearTimeout(wrongTimer);wrongTimer=setTimeout(()=>{if(!completed){wrongIso=null;refreshClasses()}},700)}}
function reveal(){if(mode!=='quiz'||!current||completed)return;completed=true;total++;wrongIso=null;correctIso=current.iso2;updateScore();refreshClasses();feedback(`答案：${current.names.zh}（${current.names.en}）`,'info')}
function showStudy(e,iso){const c=DATA.get(iso);if(!c)return;studyIso=iso;refreshClasses();const r=wrap.getBoundingClientRect();pop.querySelector('b').textContent=c.names.zh;pop.querySelector('span').textContent=`${c.names.en} · ${c.names.ja}`;pop.style.left=(e.clientX-r.left)+'px';pop.style.top=(e.clientY-r.top)+'px';pop.style.display='block'}
paths.forEach(p=>{p.addEventListener('click',e=>{if(drag?.moved||gestureMoved)return;mode==='study'?showStudy(e,p.dataset.iso):guess(p.dataset.iso)})});
function updateUI(){mode=document.getElementById('mode').value;continent=document.getElementById('continent').value;document.getElementById('badge').textContent='範圍：'+labels[continent];document.getElementById('next').disabled=mode!=='quiz';document.getElementById('reveal').disabled=mode!=='quiz';wrongIso=correctIso=null;studyIso=null;completed=false;current=null;pop.style.display='none';setView(views[continent]||views.all);refreshClasses();if(mode==='quiz'){document.getElementById('hint').textContent='測驗模式不顯示國名；答錯也不會揭露答案';document.getElementById('promptIcon').textContent='⌖';nextQuestion()}else{document.getElementById('hint').textContent='學習模式：點選國家後會以黃色＋深色邊框持續標示';document.getElementById('promptIcon').textContent='◉';document.getElementById('question').innerHTML='學習模式<small>點選國家查看名稱，並持續高亮國家輪廓</small>';feedback('')}}
document.getElementById('mode').onchange=updateUI;document.getElementById('continent').onchange=updateUI;document.getElementById('next').onclick=nextQuestion;document.getElementById('reveal').onclick=reveal;document.getElementById('resetScore').onclick=()=>{correct=0;total=0;updateScore();feedback('分數已重置')};

document.addEventListener('contextmenu',e=>{if(e.target.closest?.('#world'))e.preventDefault()});
updateScore();updateUI();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
